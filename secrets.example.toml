# انسخ هذا الملف باسم: secrets.toml (بدون كلمة example) وضعه داخل مجلد .streamlit
# لو هتشغل البرنامج محليًا فقط، مش لازم تعمل الخطوة دي — البرنامج هيعرض لك رفع ملف JSON يدويًا من الشريط الجانبي.
# الخطوة دي مطلوبة بس لو هتنشر البرنامج على streamlit.io (Streamlit Community Cloud).

sheet_id = "PASTE_GOOGLE_SHEET_ID_HERE"
worksheet_name = "بيانات"

# افتح ملف الـ Service Account JSON اللي حملته من Google Cloud،
# وانسخ كل قيمة من جواه هنا كما هي (خصوصًا private_key لازم يفضل فيه \n كما هو).
[gcp_service_account]
type = "service_account"
project_id = "your-project-id"
private_key_id = "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
private_key = "-----BEGIN PRIVATE KEY-----\nXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX\n-----END PRIVATE KEY-----\n"
client_email = "your-service-account@your-project-id.iam.gserviceaccount.com"
client_id = "xxxxxxxxxxxxxxxxxxxxx"
auth_uri = "https://accounts.google.com/o/oauth2/auth"
token_uri = "https://oauth2.googleapis.com/token"
auth_provider_x509_cert_url = "https://www.googleapis.com/oauth2/v1/certs"
client_x509_cert_url = "https://www.googleapis.com/robot/v1/metadata/x509/your-service-account%40your-project-id.iam.gserviceaccount.com"
